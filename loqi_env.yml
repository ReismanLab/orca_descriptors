# LoQI (diffusion conformer generator, organics only): https://github.com/isayevlab/LoQI
# Needs PyTorch >= 2.8, which conflicts with the torch fairchem pins in gp_env, so it gets its own
# environment. bceg calls it through its CLI: set, in the bceg config,
#   methods.loqi.params.executable: /groups/ReismanLab/miniconda3/envs/loqi/bin/loqi
#
#   conda env create -f /groups/ReismanLab/orca_descriptors/loqi_env.yml
name: loqi
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - "loqi @ git+https://github.com/isayevlab/LoQI"

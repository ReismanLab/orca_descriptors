# One ORCA library in one file: the conformer ensembles (bceg) and the ORCA compound jobs.
# Relative paths are relative to this file. `submit` freezes the resolved copy under
# <library_dir>/_jobs/<timestamp>/ and the cluster jobs read that snapshot.
#
#   orcadesc submit <LIB>.yaml --dry-run
#   orcadesc submit <LIB>.yaml
#   orcadesc status <LIB>.yaml
#
# What defines the results is written to <library_dir>/params.json on the first submit and refused if it
# changes later: source.transformation / method / lot, the bceg settings of that transformation, method
# and post-optimisation, and the dft block. A different level of theory is a different library_dir.
# orca on/off, run_bceg, the paths and both slurm blocks may change freely.

library_dir: ../DATA/orca/example_library        # absolute on the cluster, e.g. /groups/ReismanLab/DATA/orca/<LIB>

source:
  kind: bceg
  smiles: ../inputs/example_NN_ligands.txt        # one SMILES per line, optional name after it; # starts a comment
  transformation: NiH2                            # which transformation and method below give the ensembles to refine
  method: crest_gfn2
  lot: null                                       # null = the post-optimisation level below (uma-s-1p2); the file refined is raw_1_<lot>.xyz
  run_bceg: true                                  # false: the ensembles exist already, do not call bceg
  # results_dir: defaults to <library_dir>/ensembles  (bceg layout: <results_dir>/<transformation>/<InChIKey>/<method>/)

  # ---- the bceg settings (docs/bceg_README.md, docs/bceg_SUBMITTING.md). `config: /path/to/bceg.yaml` is accepted instead.
  config:
    replicates: 1                                 # ORCA refines replicate 1 only
    transformations:                              # depth-1 folders of the ensembles; a transformation turns the SMILES into the structure computed
      none: {multiplicity: 1}
      NiH2: {script: ni_x2.py, params: {x: H}, multiplicity: 1}     # N,N ligand -> L-NiH2 (script shipped with bceg)
      NiF2: {script: ni_x2.py, params: {x: F}, multiplicity: 1}
    methods:                                      # the method name IS the parameter set: changing a parameter of an existing method is refused, rename it
      crest_gfn2:
        searcher: crest
        params:
          workhorse: gfn2                         # threads: default = the job's cpus_per_task
          toml_extra: {cregen: {ewin: 6.0}}       # CREST's own energy window, kcal/mol
      goat_xtb:
        searcher: goat
        params: {method: XTB, orca_cmd: /central/software9/external/orca/orca_6_1_0_linux_x86-64_shared_openmpi418_avx2/orca, nprocs: 4, goat_block: {MaxEn: 6.0}}
        slurm: {ntasks: 4, cpus_per_task: 1, nodes: 1}   # ORCA wants MPI ranks (ntasks), not cpus_per_task
      molassembler:
        searcher: molassembler
        params: {n_confs: 100}
        slurm: {cpus_per_task: 1}
      rdkit_etkdg:
        searcher: rdkit_etkdg
        params: {n_confs: 300}
    post_optimization:                            # every raw_1.xyz -> raw_1_<lot>.xyz
      refiner: uma
      params: {model: uma-s-1p2, task: omol, optimizer: LBFGS, fmax: 0.05, max_steps: 500, device: cpu}
    slurm:                                        # bceg's jobs; `setup` defaults to the library's slurm.setup below
      mode: chained                               # each job: search then post-optimisation
      tasks_per_job: 1
      array_throttle: 50
      cpu: {partition: CHANGE_ME, time: "24:00:00", cpus_per_task: 8, mem: 16G}
      # gpu: {partition: CHANGE_ME, time: "12:00:00", cpus_per_task: 8, mem: 32G, gres: "gpu:1"}   # only for device: cuda

orca: on                                          # off: ensembles only; run the same command later with on

dft:
  ewin_kcal_mol: 5.0                              # conformers within this window of the ensemble minimum get an ORCA job
  # calc_param_template: calcParam.inp.tmpl       # default: desc_utils/submit/calcParam.inp.tmpl (structure of the compound job)
  level_of_theory:                                # charge and multiplicity are NOT here: they come from the ensemble
    conf_search: false                            # ORCA's own GOAT search (off: the ensemble is the conformer search)
    opt_geom: true
    freq_calc: true
    nmr_calc: true
    vertical_redox: true
    goat_method: XTB
    opt_method: "wb97m-d4 def2-tzvp(-f)"          # the LNiH2 library settings
    opt_solvent: ""
    svp_method: "m06 d4 def2-tzvp"
    property_solvent: ""
    nmr_method: "m06 d4 def2-tzvp"
    nbo_run: "NBO NPA"
    extra_basis: {Ni: def2-tzvp}                  # full def2-TZVP on Ni in the optimization and frequency steps; {} for none

slurm:
  setup:                                          # start of every job (prepare, ORCA, and bceg's unless its slurm block has its own setup)
    - source /groups/ReismanLab/miniconda3/etc/profile.d/conda.sh
    - conda activate gp_env
    - module load orca/6.1.0
    - export NBOBIN=/resnick/groups/ReismanLab/nbo7/bin
    - export NBOEXE=$NBOBIN/nbo7.i8.exe
    - export GENEXE=$NBOBIN/gennbo.i8.exe
    - export PATH="$PATH:$NBOBIN"
    - ulimit -s unlimited
  prepare: {time: "00:30:00", mem: 2G, cpus_per_task: 1}
  orca: {time: "160:00:00", mem_per_cpu: 4G, ntasks: 16, nodes: 1}   # ntasks -> %pal nprocs; mem_per_cpu -> %maxcore (75 %)
  array_throttle: 50

condense: true                                    # write conf_N/orca_condensed.json when each ORCA job ends

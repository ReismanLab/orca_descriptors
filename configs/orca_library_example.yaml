# One ORCA library in one file, one block per stage. Relative paths are relative to this file.
# `submit` freezes the resolved copy under <library_dir>/_jobs/<timestamp>/ and the cluster jobs read it.
#
#   orcadesc submit <LIB>.yaml --dry-run
#   orcadesc submit <LIB>.yaml
#   orcadesc status <LIB>.yaml
#
# The six stage blocks define the results: they are written to <library_dir>/params.json on the first
# submit (with the searcher's and refiner's defaults filled in) and refused if they change later. A
# different choice in any of them is a different library_dir. run_bceg, orca on/off, the paths, slurm
# and condense are recorded but may change freely. Every option and parameter of each stage is listed
# in docs/stages/<n>_<stage>.md.

library_dir: ../DATA/orca/example_library        # absolute on the cluster, e.g. /groups/ReismanLab/DATA/orca/<LIB>
smiles: ../inputs/example_NN_ligands.txt         # one SMILES per line, optional name after it; # starts a comment
# ensembles_dir: <library_dir>/ensembles         # bceg layout: <ensembles_dir>/<transformation>/<InChIKey>/<method>/
run_bceg: true                                   # false: the ensembles exist already, do not call bceg

# ---- 1. transformation: the SMILES -> the structure computed (docs/stages/1_transformation.md)
transformation:
  name: NiH2                                     # depth-1 folder of the ensembles; `transformation: none` = the SMILES as is
  script: ni_x2.py                               # N,N ligand -> L-NiH2 (shipped with bceg); your own script works too
  params: {x: H}
  multiplicity: 1                                # charge: 0 is the default; both apply to every later stage

# ---- 2. pre-refinement: the start geometry handed to the search (docs/stages/2_pre_refinement.md)
pre_refinement:                                  # CREST, GOAT and molassembler start from one pre-optimised geometry
  method: xtb                                    # xtb (default) | uma | none
  params: {gfn: gfn2, level: normal}             # uma: {model: uma-s-1p2, task: omol, fmax: 0.05, max_steps: 500}
  # start_geometry: etkdg                        # etkdg (new embedding per seed) | input (coordinates from the transformation)
  # max_metal_ligand_distance: 2.5               # Angstrom; a longer bond to the metal rejects the start geometry

# ---- 3. conformer search (docs/stages/3_conformer_search.md)
conformer_search:
  name: crest_gfn2                               # the name IS the parameter set: a changed parameter under the same name is refused
  searcher: crest                                # crest | goat | molassembler | rdkit_etkdg | loqi
  # replicates: 1                                # searches per molecule, each from its own seed; pooled before pruning
  params:
    workhorse: gfn2                              # threads: default = the job's cpus_per_task
    toml_extra: {cregen: {ewin: 6.0}}            # CREST's own energy window, kcal/mol
  # slurm: {ntasks: 4, cpus_per_task: 1}         # overrides of slurm.ensembles.cpu for this step (GOAT wants MPI ranks)

# ---- 4. post-optimisation: every conformer -> raw_1_<lot>.xyz (docs/stages/4_post_optimization.md)
post_optimization:                               # `post_optimization: null` = none, ORCA then refines the search output
  refiner: uma                                   # or gxtb (g-xTB, CPU: params {level, executable}) or aimnet2 (params like uma: model, fmax, device)
  params: {model: uma-s-1p2, task: omol, optimizer: LBFGS, fmax: 0.05, max_steps: 500, device: cpu}

# ---- 5. pruning: which conformers get an ORCA job (docs/stages/5_pruning.md)
pruning:
  energy_window_kcal_mol: 5.0                    # null (the default): every conformer; the window is on the stage-4 energies

# ---- 6. dft: the ORCA compound job (docs/stages/6_dft.md)
orca: on                                         # off: stop after the ensembles; the same command later with on refines them
dft:
  # calc_param_template: calcParam.inp.tmpl      # default: desc_utils/submit/calcParam.inp.tmpl (structure of the compound job)
  level_of_theory:                               # charge and multiplicity are NOT here: they come from the ensemble
    opt_geom: true
    freq_calc: true
    nmr_calc: true
    vertical_redox: true
    opt_method: "wb97m-d4 def2-tzvp(-f)"         # the LNiH2 library settings
    opt_solvent: ""
    svp_method: "m06 d4 def2-tzvp"
    property_solvent: ""
    nmr_method: "m06 d4 def2-tzvp"
    nbo_run: "NBO NPA"
    extra_basis: {Ni: def2-tzvp}                 # full def2-TZVP on Ni in the optimization and frequency steps; {} for none

# ---- resources
slurm:
  setup:                                         # start of every job (bceg's, prepare, ORCA)
    - source /groups/ReismanLab/miniconda3/etc/profile.d/conda.sh
    - conda activate gp_env
    - export LD_LIBRARY_PATH=$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}   # pip wheels (torch) take the env's libstdc++, not the old system one
    - export FAIRCHEM_CACHE_DIR=/groups/ReismanLab/hf_cache/hub   # UMA weights, fetched once on a login node (README step 2); fairchem reads this, not HF_HUB_CACHE
    - export HF_HUB_OFFLINE=1                              # compute nodes never try the network
    - module load orca/6.1.0
    - export NBOBIN=/resnick/groups/ReismanLab/nbo7/bin
    - export NBOEXE=$NBOBIN/nbo7.i8.exe
    - export GENEXE=$NBOBIN/gennbo.i8.exe
    - export PATH="$PATH:$NBOBIN"
    - ulimit -s unlimited
  ensembles:                                     # bceg's jobs (stages 1-4): one job per molecule, search then post-optimisation
    mode: chained
    tasks_per_job: 1
    array_throttle: 50
    cpu: {time: "24:00:00", cpus_per_task: 8, mem: 16G}          # add partition: <name> to leave the default partition
    # gpu: {partition: <gpu partition>, time: "12:00:00", cpus_per_task: 8, mem: 32G, gres: "gpu:1"}   # only for device: cuda
  prepare: {time: "00:30:00", mem: 2G, cpus_per_task: 1}
  orca: {time: "160:00:00", mem_per_cpu: 4G, ntasks: 16, nodes: 1}   # ntasks -> %pal nprocs; mem_per_cpu -> %maxcore (75 %)
  array_throttle: 50

condense: true                                   # write conf_N/orca_condensed.json when each ORCA job ends

# ---------------------------------------------------------------------------
# workflow_inputs.yaml
#
# Every CHOSEN setting for the ligand pipeline (make/CREST/UMA/DFT), in one
# place, so you don't have to go hunting through crest.py / uma_opt_confs.py /
# launch_orca_all.py / launch_workflow.sh to change a parameter.
#
# What does NOT belong here: anything the pipeline DISCOVERS at run time
# rather than something you choose -- rdkit_version, crest_version,
# orca_module, calc_param_md5, and so on. Those are recorded automatically in
# each molecule's metadata.json for provenance; putting them here would just
# be something to fall out of sync with reality.
#
# Copy this file per batch (e.g. workflow_inputs.yaml next to your
# smiles.txt) and point the pipeline at it with:
#     export WORKFLOW_INPUTS=/path/to/your/workflow_inputs.yaml
# or just leave it as workflow_inputs.yaml in the batch directory, which is
# the default get_input.py / workflow_inputs.py look for.
# ---------------------------------------------------------------------------

conformer_gen:
  optimize: true            # pre-optimize the RDKit-embedded structure with xtb before CREST
  xtb_gfn_level: 2          # `xtb mol.xyz --opt --gfn <N>`

crest:
  charge: 0
  spin_multiplicity: 1
  ewin_kcal_mol: 15.0        # CREST's OWN conformer energy window (distinct from dft.ewin_kcal_mol below)
  n_conf: 10
  quick: false
  norotmd: false
  noreftopo: true
  cores: 16                  # also used as launch_workflow.sh's --ntasks-per-node for this stage

uma:
  model_name: uma-s-1p1
  fmax: 0.05                 # BFGS force-convergence threshold, eV/Angstrom
  task_name: omol

dft:
  ewin_kcal_mol: 5.0          # energy window for which UMA-ranked conformers get an ORCA job
  calc_param_template: calcParam.inp.tmpl   # ORCA Compound template, rendered into calcParam.inp
                                             # per ligand from level_of_theory below (charge/
                                             # multiplicity come from crest.charge / crest.spin_
                                             # multiplicity above, so CREST and DFT can't disagree
                                             # on what species is being computed).
                                             # calcParam.inp.tmpl still controls STRUCTURE -- which
                                             # Compound steps exist and how they chain together --
                                             # edit that file directly if you need a different step
                                             # sequence; edit the values below for a different
                                             # method/basis/solvent.
  level_of_theory:
    conf_search: false          # run ORCA's own GOAT conformer search (off: CREST already did this)
    opt_geom: true               # run geometry optimization
    freq_calc: true              # run frequency calculation (confirms a true minimum)
    nmr_calc: true                # run NMR shielding calculation
    vertical_redox: true          # run vertical (no re-opt) oxidation/reduction single points
    goat_method: XTB              # method GOAT would use, if conf_search is enabled
    opt_method: "M06 6-31g(d)"      # functional/dispersion/basis for optimization + freq
    opt_solvent: "CPCM(THF)"             # implicit solvent for optimization
    svp_method: "b3lyp 6-31g(d,p)"      # functional/basis for the single-point step
    property_solvent: "CPCM(THF)"        # implicit solvent for single-point/NMR/redox properties
    nmr_method: "b3lyp 6-31g(d)"      # functional/basis for NMR
    nbo_run: "NBO NPA"                   # NBO/NPA population analysis settings
    extra_basis: {}                      # per-element basis overrides for the optimization and frequency steps,
                                         # rendered as a %basis block: e.g. {Ni: def2-tzvp} puts full def2-TZVP on
                                         # Ni while opt_method uses def2-tzvp(-f) (the LNiH2 library setting).
                                         # {} = none. Recorded per step in metadata.json's dft.compound_steps.

slurm:
  # Resources for the main launch_workflow.sh job (build + crest + uma + orca_submit stages).
  # NOTE: SLURM reads #SBATCH lines at submission time, before this file is ever opened, so
  # submit_all_smiles.py passes these as `sbatch --time=... --mem-per-cpu=...` flags, which
  # override the #SBATCH defaults baked into launch_workflow.sh.
  main_job:
    time: "60:00:00"
    mem_per_cpu: "4G"
    ntasks_per_node: 16       # keep in sync with crest.cores above unless you have a reason not to

  # Resources for each per-conformer ORCA job. Same override mechanism, applied by
  # launch_orca_all.py when it submits slurm-calcParam.sh.
  orca_job:
    time: "160:00:00"
    mem_per_cpu: "4G"
    ntasks_per_node: 16

environment:
  conda_env: nickel_oa
  omol_env_path: /resnick/groups/ReismanLab/JCS/omol_env
  orca_descriptors_repo: /groups/ReismanLab/orca_descriptors   # clone whose desc_utils.condense each ORCA job runs at the end
                                                               # (writes conf_N/orca_condensed.json; standard library only)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bceg"
version = "0.1.0"
description = "B-CEG-MCD: benchmarking conformer ensemble generation/refinement for reactivity descriptors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "rdkit",
]

[project.optional-dependencies]
uma = ["fairchem-core", "ase"]  # fairchem-core already requires ase; listed because bceg imports it directly
molassembler = ["scine-molassembler==3.0.1", "scine-utilities==10.1.0"]  # exact pin; utilities from the same SCINE release (2025-10-09)
dev = ["pytest"]

[project.scripts]
bceg = "bceg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bceg.transforms_builtin" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

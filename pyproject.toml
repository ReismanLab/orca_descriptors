[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bceg"
version = "0.1.0"
description = "B-CEG-MCD: benchmarking conformer ensemble generation/refinement for reactivity descriptors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "rdkit",
]

[project.optional-dependencies]
uma = ["fairchem-core", "ase"]
molassembler = ["scine-molassembler"]
dev = ["pytest"]

[project.scripts]
bceg = "bceg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: gp_env
channels:
  - anaconda
  - conda-forge
dependencies:
  - python=3.11
  - ipykernel=6.29.5
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - pytest=9.1.1
  - pip=24.2
  # The numeric and chemistry stack is pip-managed. Earlier conda pins (numpy=1.26.4,
  # pandas=1.5.3, scipy=1.14.1) were stale: `conda env update --file gp_env.yml --prune`
  # laid pandas 1.5.3 over the pip numpy 2.3.4 the code is validated with and pandas
  # then failed to import ("numpy.dtype size changed"). Versions below are the ones the
  # test suite and reference CSVs were produced with (2026-09-19).
  - pip:
      - numpy==2.3.4
      - pandas==2.3.3
      - scipy==1.15.0
      - pyarrow==23.0.1        # .feather inputs for the DescriPyTor block
      - tqdm==4.67.3
      - morfeus-ml==0.7.2
      - rdkit==2026.3.6          # 2026.3.1+ required by LoQI (cluster env); regression suite re-validated 2026-10-01
      - dbstep==1.1.0
      - cclib==1.8.1
      - matplotlib==3.10.0     # notebooks only
      - openbabel-wheel==3.1.1.23   # xyz -> sdf for the SMARTS numbering backend (desc_utils.numbering.io)
      - networkx==3.6.1             # DescriPyTor connectivity graphs (imported by M2_data_extractor)
      - plotly==7.1.0               # imported at module level by DescriPyTor/utils/help_functions.py

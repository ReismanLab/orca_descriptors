# LNiH2 / PyOx ligand library (bidentate N,N ligands on a Ni dihydride core).
# Reproduces atom_numbering_results.csv and the 20260423 descriptor CSV.
#
# Conventions
#   - Every SMARTS must be quoted: '#' starts a YAML comment, so [#7] would be cut off.
#   - Atom terms are written with labels from `atoms`; order matters where the descriptor
#     is directional (Sterimol axis, dipole frame, angles).
#   - Indices in the numbering table are 1-based (DescriPyTor / Gaussian convention).
name: LNiH2_library_001_to_download_2026_03_24
spec_version: 1

data:
  root: DATA/LNiH2_library_001_to_download_2026_03_24
  layout: molecule/conformer          # <root>/<molecule_id>/<conformer>/
  conformer_glob: "conf_*"
  geometry_file: optimization.xyz
  molecule_id_column: inchikey           # the molecule folder name is an InChIKey

atoms:                                # order = column order in the numbering table
  H1: H
  Ni: Ni
  H2: H
  N1: N
  C1: C
  C2: C
  N2: N

numbering:
  backend: smarts
  index_base: 1
  consistency: per_molecule           # flag molecules whose conformers disagree
  smarts:
    match_selection: first            # first RDKit match (legacy behaviour); or lowest_indices
    stages:
      # Stage 1: dihydride core. The three patterns are the legacy alternatives, tried in order;
      # the first one that matches is used. Positions: 0 H, 1 Ni, 2 H, 3 N, 4 C, 5 C, 6 N.
      - name: core_5
        smarts:
          - "[H][Ni]1([H])[N]C=C[N]1"
          - "[H][Ni]1([H])[N]CC[N]1"
          - "[H][Ni]1([H])~[#7]~[#6]~[#6]~[#7]~1"
        roles: {H1: 0, Ni: 1, H2: 2, N1: 3, C1: 4, C2: 5, N2: 6}
        required: true
      # Stage 2: PyOx orientation. Overrides N1/C1/C2/N2 so that N1 is the pyridine nitrogen
      # and N2 the oxazoline nitrogen. Not required: non-PyOx ligands keep stage-1 labels.
      - name: pyox_orient
        smarts: "[#7]~1(~[#28]~2)~[#6](~[#6]3~[#7]2~[#6]~[#6]~[#8]~3)~[#6]~[#6]~[#6]~[#6]1"
        roles: {N1: 0, C1: 2, C2: 3, N2: 4}
        required: false
  orient: []                          # e.g. {rule: closest, move: [H1, H2], to: [N1, N2]}
  annotators: [lnih2_ligand_class]    # adds ligand_type (core_5/core_6) and ligand_class (pyox, biox, ...)
  smiles:
    source: file                      # pre-orcadesc library, no molecule_registry.json: the list it was submitted
    file: inputs/LNiH2_ligands_audrey.txt   # with (= the LNiH2_library_002 list), matched to the folders by InChIKey
    mode: strip_atoms                 # source: geometry only (wrong tautomer for L-NiH2, see docs/descriptor_pipeline.md)
    strip: [Ni]
  energy:
    basename: singlepoint             # <basename>.property.json -> SCF energy
    column: SCF_energy

descriptors:
  orca:                               # ORCA property JSON / NBO output / morfeus on optimization.xyz
    xyz:
      atoms: [H1, H2, C1, C2, N1, N2, Ni]
      bonds: &bonds
        - [C1, N1]
        - [N1, C1]
        - [C2, N2]
        - [N2, C2]
        - [Ni, N1]
        - [Ni, N2]
        - [Ni, H1]
        - [Ni, H2]
        - [C1, C2]
        - [C2, C1]
      angles: &angles
        - [H2, Ni, H1]
        - [Ni, N1, C1]
        - [Ni, N2, C2]
        - [N1, C1, C2]
        - [N2, C2, C1]
        - [N1, Ni, N2]
        - [C1, Ni, C2]
      dihedrals:
        - [N1, C1, C2, N2]
        - [C1, C2, N2, Ni]
        - [C2, C1, N1, Ni]
      quadrants: []
      vbur_radii: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
      use_cached_json: true           # reuse <conf>/xyz.json when present
    charges:
      atoms: [H1, H2, C1, C2, N1, N2, Ni]
      basename: singlepoint
    # NBO descriptors. `naming: rank` (the default, kept so the 20260423 CSV reproduces) names an
    # NBO by its number counted from the highest occupied one, which is not the same orbital from
    # one ligand to the next. `naming: chemical` (desc_utils/nbo_keys.py, docs/descriptors.md) names
    # it by type, sigma/pi/d class and labelled atoms, and adds E(2) per orbital pair:
    #   nbo_<TYPE>_<class>_<atoms>_<field>     e.g. nbo_LP_dz2_Ni_occupancy_mean, nbo_BD_pi_C2_N2_energy_mean,
    #                                               nbo_BDstar_pi_N1_any_occupancy_mean (pyridine pi*, partner unlabelled)
    #   nbo_e2_<donor>_to_<acceptor>           kcal/mol, summed over NBOs sharing a name, e.g.
    #                                               nbo_e2_BD_pi_C1_any_to_BDstar_pi_C2_N2 (pyridine -> oxazoline conjugation)
    #                                               nbo_e2_LP_sp_N1_to_BDstar_sigma_Ni_H2  (trans influence; needs the trans block below)
    #                                               nbo_e2_LP_dxz_Ni_to_BDstar_pi_C2_N2    (Ni back-donation into C=N pi*)
    # The atom order inside a name follows `atoms:` below. NBO prints E(2) pairs from 0.50 kcal/mol
    # (closed shell; 0.25 per spin open shell): a missing pair is 0 when the conformer has both
    # orbitals, NaN only when one of them does not exist there. With `frame: [Ni, N1, N2]` the Ni d
    # lone pairs are named dz2/dxy/dxz/dyz (x towards N1, y towards N2, z perpendicular); a d
    # orbital with no component >= 60 % keeps the plain `d` class. To switch on:
    #     naming: chemical
    #     frame: [Ni, N1, N2]
    # (homo_lumo_rank_range and drop_analysis_info then do nothing). The lone-pair classes need the
    # one-centre hybrids that `condense` records since this change: re-run
    #     python -m desc_utils.condense --root DATA/<library> --overwrite
    # on condensed files written before it (the ORCA output is read instead when it is beside them).
    # Checked 2026-11-26 on 12 LNiH2_library_002 complexes: the same names in all 12, orbitals plotted
    # from singlepoint.nbo matched (desc_utils.nbo_keys; NBO number - 1 = orca_plot orbital index).
    # NLMOs need one NBO rerun per conformer, saved as conf_N/nlmo.out (recipe in
    # configs/orca_library_example.yaml). Then `nlmo_basename: nlmo` adds per key
    #   nbo_<key>_nlmo_parent      % of the NLMO that is its parent NBO (100 = fully localized)
    #   nbo_<key>_nlmo_on_<label>  % of it on each other labelled atom, e.g. nbo_LP_sp_N1_nlmo_on_H2
    # A conformer without the file gets nbo_nlmo_error and NaN NLMO columns.
    nbo:
      atoms: [H1, H2, C1, C2, N1, N2, Ni]
      basename: singlepoint
      homo_lumo_rank_range: [1, 2, 3, 4, 5]   # keep _hmN_/_lpN_ columns only for these N
      drop_analysis_info: true
    redox:
      atoms: [H1, H2, C1, C2, N1, N2, Ni]
      prefixes: [nbo_charge, cm5]
      nbo_block_map: {singlepoint: 1, oxidation: 2, reduction: 3}   # 1-based NBO block per job
  descripytor:                        # DescriPyTor `Molecules` families (Schema B key names)
    input: {kind: json}                 # <conf>/orca_condensed.json, written by desc_utils.condense
    charges: [H1, H2, C1, C2, N1, N2, Ni]
    sterimol: *bonds
    bond_length: *bonds
    stretching_vibration: *bonds
    charge_diff: *bonds
    stretch_threshold: 1400
    upper_stretch_threshold: 3500
    bending_vibration:
      - [H1, H2]
      - [N1, C2]
      - [N2, C1]
    bend_threshold: 1300
    dipole:
      - [Ni, N2, N1]                  # origin, y-axis atom, xy-plane atom
    bond_angle: *angles
    radii: CPK
    drop_atoms: []

# H1/H2 by the donor each hydride is trans to (desc_utils/trans.py). Off here so the 20260423 CSV
# reproduces: without it H1/H2 follow xyz order, so any hydride column (Ni-H1, the E(2) of an N
# lone pair into a Ni-H sigma*) names a different site on different molecules. On 12
# LNiH2_library_002 complexes it swapped 9 and made N1 LP -> sigma* Ni-H2 50-54 kcal/mol in all 12
# (0.0-53 without). To switch on, uncomment:
# trans:
#   enabled: true
#   centre: Ni
#   pairs: [[H1, H2]]                   # H1 is the one trans to trans_to[0]
#   trans_to: [N2, N1]
#   min_margin_degrees: 20              # below this the conformer keeps its match-order labels
# Keep output.numbering_csv a bare file name with it on: the trans record is written next to it
# with Path.with_name, which refuses a name containing a folder.

aggregate:
  group_by: inchikey
  energy_column: SCF_energy
  temperature_K: 298.15
  kB_hartree_per_K: 3.166811563e-6
  stats: [min, max, lowE, boltz]
  carry_first: [smiles, smiles_noH, ligand_class]

filter:                               # optional noise filter for modelling sets; the library itself stays complete
  enabled: false                      # true, or `aggregate --filter`, applies the settings below
  remove_low_occupancy_nbo: true
  occupancy_boltz_threshold: 0.001
  corr_threshold: 0.95
  corr_pruning_mode: bridge_star_centers
  ratio_threshold: 0.01
  orbital_filter: remove rydbergs
  cor_orbital_filter: remove cor
  metal_label: Ni                     # keeps metal Rydberg columns; null disables the metal rules
  ni_orbital_filter: remove 4f rydbergs
  nmr_filter: remove aniso
  bond_analysis_filter: remove phi theta

output:
  numbering_csv: "{date}_{name}_atom_numbering_results.csv"
  per_conformer_csv: "{date}_{name}_combined_descriptors.csv"
  aggregated_csv: "{date}_{name}_descriptors.csv"

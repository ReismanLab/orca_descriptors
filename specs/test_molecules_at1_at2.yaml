# Small organic test set: the first two atoms of every xyz file are labelled at1 and at2.
# Reproduces 20260501_test_molecules_descriptors.csv.
name: test_molecules
spec_version: 1

data:
  root: DATA/test_molecules
  layout: molecule/conformer
  conformer_glob: "conf_*"
  geometry_file: optimization.xyz
  molecule_id_column: inchi

atoms:
  at1: null                           # element unconstrained
  at2: null

numbering:
  backend: first_n                    # labels in `atoms` order -> atoms 1..N
  index_base: 1
  consistency: per_molecule
  orient: []
  annotators: []
  smiles: {mode: whole_molecule}
  energy: {basename: singlepoint, column: SCF_energy}

descriptors:
  orca:
    xyz:
      atoms: [at1, at2]
      bonds: [[at1, at2]]
      angles: []
      dihedrals: []
      quadrants: []
      vbur_radii: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
      use_cached_json: true
    charges: {atoms: [at1, at2], basename: singlepoint}
    nbo: {atoms: [at1, at2], basename: singlepoint, homo_lumo_rank_range: [1, 2, 3, 4, 5], drop_analysis_info: true}
    redox: {atoms: [at1, at2], prefixes: [nbo_charge, cm5], nbo_block_map: {singlepoint: 1, oxidation: 2, reduction: 3}}
  descripytor:
    input: {kind: json}                 # <conf>/orca_condensed.json (desc_utils.condense); feather = legacy path
    charges: [at1, at2]
    sterimol: [[at1, at2]]
    bond_length: [[at1, at2]]
    stretching_vibration: [[at1, at2]]
    charge_diff: [[at1, at2]]
    bending_vibration: []
    dipole: []
    bond_angle: []

aggregate:
  group_by: inchi
  energy_column: SCF_energy
  temperature_K: 298.15
  kB_hartree_per_K: 3.166811563e-6
  stats: [min, max, lowE, boltz]
  carry_first: [smiles, smiles_noH]

filter:                               # optional noise filter for modelling sets; the library itself stays complete
  enabled: false                      # true, or `aggregate --filter`, applies the settings below
  remove_low_occupancy_nbo: true
  occupancy_boltz_threshold: 0.001
  corr_threshold: 0.95
  corr_pruning_mode: bridge_star_centers
  ratio_threshold: 0.01
  orbital_filter: remove rydbergs
  cor_orbital_filter: remove cor
  metal_label: null
  nmr_filter: remove aniso
  bond_analysis_filter: remove phi theta

output:
  numbering_csv: "{date}_{name}_atom_numbering_results.csv"
  per_conformer_csv: "{date}_{name}_combined_descriptors.csv"
  aggregated_csv: "{date}_{name}_descriptors.csv"

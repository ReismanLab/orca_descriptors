# Terminal alkynes on an aromatic ring: Ar-C#C-H.
#
# Labels (see `atoms`): H1 acetylenic H, C1 terminal alkyne C, C2 internal alkyne C,
# Cipso ring atom bearing the alkyne. The ring itself is not labelled so that any
# (hetero)aromatic ring works (phenyl, pyridyl, furyl, thienyl, naphthyl, ...).
#
# Conventions
#   - Every SMARTS must be quoted: '#' starts a YAML comment, so [#6] and C#C would be cut off.
#   - Terms below are written with labels; order matters where the descriptor is directional.
#   - Indices in the numbering table are 1-based.
name: aryl_alkynes
spec_version: 1

data:
  root: DATA/aryl_alkynes               # <-- adapt to the computation folder
  layout: molecule/conformer            # <root>/<molecule_id>/<conformer>/
  conformer_glob: "conf_*"
  geometry_file: optimization.xyz
  molecule_id_column: inchi

atoms:                                  # order = column order in the numbering table
  H1: H
  C1: C
  C2: C
  Cipso: C

numbering:
  backend: smarts
  index_base: 1
  consistency: per_molecule
  smarts:
    # lowest_indices: deterministic choice when a molecule carries two terminal alkynes;
    # the file order is the same for all conformers.
    match_selection: lowest_indices
    stages:
      # Positions: 0 H1, 1 C1, 2 C2, 3 Cipso.
      # Pattern 1 needs Open Babel to have perceived the triple bond and RDKit the aromaticity;
      # pattern 2 only relies on connectivity (two-coordinate carbons, ring atom).
      - name: aryl_alkyne
        smarts:
          - "[H][#6]#[#6]-[#6;a]"
          - "[H][#6X2]~[#6X2]-[#6;R]"
        roles: {H1: 0, C1: 1, C2: 2, Cipso: 3}
        required: true
  orient: []
  annotators: []
  smiles: {mode: whole_molecule}
  energy: {basename: singlepoint, column: SCF_energy}

descriptors:
  orca:
    xyz:
      atoms: [H1, C1, C2, Cipso]
      bonds: &bonds
        - [C1, H1]
        - [C2, C1]
        - [Cipso, C2]
        - [C2, Cipso]                   # both directions: Sterimol of the arene seen from the alkyne, and vice versa
      angles: &angles
        - [H1, C1, C2]                  # linearity of the alkyne
        - [C1, C2, Cipso]
      dihedrals: []                     # H1-C1-C2-Cipso is linear: no well-defined dihedral
      quadrants: []
      vbur_radii: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
      use_cached_json: true
    charges: {atoms: [H1, C1, C2, Cipso], basename: singlepoint}
    nbo: {atoms: [H1, C1, C2, Cipso], basename: singlepoint, homo_lumo_rank_range: [1, 2, 3, 4, 5], drop_analysis_info: true}
    redox: {atoms: [H1, C1, C2, Cipso], prefixes: [nbo_charge, cm5], nbo_block_map: {singlepoint: 1, oxidation: 2, reduction: 3}}
  descripytor:
    input: {kind: json}
    charges: [H1, C1, C2, Cipso]
    sterimol:
      - [C2, Cipso]                     # arene as a substituent of the alkyne
      - [Cipso, C2]                     # alkyne as a substituent of the arene
    bond_length: *bonds
    stretching_vibration:
      - [C1, H1]                        # ~3300 cm-1 acetylenic C-H
      - [C2, C1]                        # ~2100 cm-1 C#C
      - [Cipso, C2]
    charge_diff:
      - [C1, H1]
      - [C2, C1]
      - [Cipso, C2]
    stretch_threshold: 1400
    upper_stretch_threshold: 3500
    bending_vibration:
      - [H1, C2]                        # C-C-H bend
    bend_threshold: 1300
    dipole: []                          # the four labels are collinear, so no dipole frame can be defined
    bond_angle: *angles
    radii: CPK
    drop_atoms: []

aggregate:
  group_by: inchi
  energy_column: SCF_energy
  temperature_K: 298.15
  kB_hartree_per_K: 3.166811563e-6
  stats: [min, max, lowE, boltz]
  carry_first: [smiles, smiles_noH]

filter:
  enabled: false
  remove_low_occupancy_nbo: true
  occupancy_boltz_threshold: 0.001
  corr_threshold: 0.95
  corr_pruning_mode: bridge_star_centers
  ratio_threshold: 0.01
  orbital_filter: remove rydbergs
  cor_orbital_filter: remove cor
  metal_label: null
  nmr_filter: remove aniso
  bond_analysis_filter: remove phi theta

output:
  numbering_csv: "{date}_{name}_atom_numbering_results.csv"
  per_conformer_csv: combined_descriptors_aryl_alkynes.csv
  aggregated_csv: "{date}_{name}_descriptors.csv"

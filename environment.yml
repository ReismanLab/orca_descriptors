# Minimal cluster environment. conda provides only python and the two binaries (xtb, crest);
# every Python dependency comes from pyproject.toml through the editable install below.
name: bceg
channels:
  - conda-forge
dependencies:
  - python=3.11   # scine-molassembler 3.0.1 wheels: cp38-cp312, Linux x86_64 only; fairchem-core: >=3.11
  - xtb
  - crest         # newest on conda-forge (3.0.2 at the time of writing). The `+uma` methods need the
                  # `mlip` level, i.e. CREST >= 3.1: build it from source and point those methods at it
                  # with `params.executable: /abs/path/to/crest`. Everything else works with 3.0.2.
  - pip
  - pip:
      - -e .[uma,molassembler]   # bceg + fairchem-core/ase (UMA) + scine-molassembler==3.0.1
# Extras: `pip install -e .[uma]` or `.[molassembler]` alone if a method is not needed; `.[dev]` adds pytest.
# UMA weights are gated: run `huggingface-cli login` once.
# Not installed here:
#   ORCA (GOAT)         -> cluster module; set methods.<name>.params.orca_cmd to the absolute path
#   fmlip-relay[uma]    -> pip install '<crest-src>/subprojects/fmlip_relay[uma]'; needs fmlip-relay-server on PATH
#   LoQI                -> separate env (Python>=3.11, PyTorch>=2.8): pip install "loqi @ git+https://github.com/isayevlab/LoQI"
#                          set methods.<name>.params.executable to that env's `loqi`
